name: Tender Agent Auto-Run
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pydantic python-dotenv requests beautifulsoup4 lxml pandas duckduckgo-search google-generativeai openai tavily-python || pip install streamlit pydantic python-dotenv requests beautifulsoup4 lxml pandas
      - name: Run Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python run_agent.py
          ls -lh tenders.db system_health.log || true
      - name: Save DB back to repo
        if: always()
        run: |
          git config --global user.name "tender-bot"
          git config --global user.email "bot@tender.local"
          git add -f tenders.db system_health.log || true
          git commit -m "auto: update tenders [skip ci]" || echo "No changes"
          git push || echo "Push failed - check write permission"
