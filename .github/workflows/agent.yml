name: Tender Agent Auto-Run

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Run real tender pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: sqlite:///./data/tenders.db
          PYTHONPATH: .
        run: |
          echo "=== Running real tender pipeline ==="
          python run_agent.py

          echo "=== Checking generated data ==="
          ls -lah data
          cat data/live_tenders.json

      - name: Commit live results to repository
        run: |
          git config user.name "Tender Intelligence Bot"
          git config user.email "tender-intelligence-bot@users.noreply.github.com"

          git add -f data/live_tenders.json data/tenders.db system_health.log || true

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update live tender scan"
            git push origin main
          fi

      - name: Upload pipeline output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tender-pipeline-output-${{ github.run_id }}
          path: |
            data/live_tenders.json
            data/tenders.db
            system_health.log
          retention-days: 14
