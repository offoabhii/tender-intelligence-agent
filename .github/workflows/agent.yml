name: Tender Agent Auto-Run
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python run_agent.py
          ls -lh tenders.db || true
      - if: always()
        run: |
          git config --global user.name "tender-bot"
          git config --global user.email "bot@tender.local"
          git add -f tenders.db system_health.log || true
          git commit -m "auto: update tenders [skip ci]" || echo "no changes"
          git push || echo "enable Read and write in Settings->Actions"
