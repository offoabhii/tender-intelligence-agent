name: Tender Agent Auto-Run

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:      # Manual trigger button
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: write  # Needed to commit data back!

jobs:
  scan-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Push back permission
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install sqlalchemy groq openai requests beautifulsoup4 lxml python-dotenv pydantic tavily-python
          
      - name: Run Agent & Generate Data
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          echo "=== Running Agent ==="
          python run_agent.py
          echo "=== Agent Finished ==="
          
          # Verify file exists
          ls -la data/
          wc -l data/live_tenders.json || echo "JSON EMPTY"
      
      - name: Commit Data Back to Repository
        run: |
          git config user.email "action@github.com"
          git config user.name "Tender Bot [bot]"
          
          git add data/live_tenders.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "[AUTO] Tender Scan $(date +'%Y-%m-%d %H:%M')"
          git push origin main || true
      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: tender-data-${{ github.run_id }}
          path: data/live_tenders.json
          retention-days: 30
